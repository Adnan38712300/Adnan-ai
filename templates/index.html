<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adnan AI Video</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#02020a,#0a0a2e 40%,#1a0a2e);color:#e8ecf4;min-height:100vh;padding:16px}
.c{max-width:600px;margin:0 auto}
.hdr{text-align:center;padding:24px 0 16px}
.hdr .tag{color:#a78bfa;font-size:10px;letter-spacing:3px;font-weight:700;text-transform:uppercase;margin-bottom:6px}
.hdr h1{font-size:36px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.hdr .s{color:#94a3b8;font-size:12px}
.card{background:rgba(15,23,42,.7);backdrop-filter:blur(14px);border:1px solid rgba(139,92,246,.25);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
h3{color:#a78bfa;font-size:14px;font-weight:800;margin-bottom:14px;letter-spacing:.5px;text-transform:uppercase}
label{display:block;color:#cbd5e1;font-size:12px;font-weight:600;margin-bottom:8px;margin-top:14px}
textarea,select{width:100%;padding:13px;background:#0a1024;border:1.5px solid rgba(139,92,246,.25);border-radius:10px;color:#fff;font-size:14px;font-family:inherit;outline:none;transition:all .2s}
textarea:focus,select:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.12)}
textarea{min-height:100px;resize:vertical}
select{cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a78bfa' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:7px 12px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);border-radius:20px;color:#c4b5fd;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.chip:hover{background:rgba(139,92,246,.25);color:#fff}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899);border:0;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:20px;font-family:inherit;letter-spacing:.5px;box-shadow:0 8px 24px rgba(139,92,246,.4);transition:all .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{text-align:center;padding:20px;display:none}
.status.on{display:block}
.spin{width:60px;height:60px;border:4px solid rgba(139,92,246,.2);border-top-color:#8b5cf6;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.status .m{color:#a78bfa;font-weight:700;font-size:14px}
.status .s{color:#94a3b8;font-size:12px;margin-top:8px}
.result{text-align:center;display:none}
.result.on{display:block}
.result video{width:100%;border-radius:14px;border:2px solid rgba(139,92,246,.4);margin-bottom:14px;background:#000}
.dl{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:10px;color:#fff;text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(34,197,94,.4);border:0;cursor:pointer;font-family:inherit}
.err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5);padding:12px;border-radius:10px;color:#fca5a5;font-size:13px;text-align:center;display:none;margin-top:14px;line-height:1.5}
.err.on{display:block}
.foot{text-align:center;color:#475569;font-size:11px;padding:20px 0}
</style></head><body>
<div class="c">
<div class="hdr">
<div class="tag">Developer</div>
<h1>Adnan</h1>
<div class="s">AI Video Generator — 100% Free</div>
</div>

<div class="card">
<h3>🎬 Generate Video</h3>
<label>Prompt Likho</label>
<textarea id="promptIn" placeholder="Jaise: 'A cute cat walking on beach, cinematic, slow motion'"></textarea>
<div class="chips">
<div class="chip" onclick="setPrompt('cinematic lighting, slow motion, 4k')">🎬 Cinematic</div>
<div class="chip" onclick="setPrompt('anime style, vibrant colors, studio ghibli')">🎌 Anime</div>
<div class="chip" onclick="setPrompt('realistic, portrait, depth of field')">📷 Realistic</div>
<div class="chip" onclick="setPrompt('3D render, pixar style, soft lighting')">🧊 3D</div>
<div class="chip" onclick="setPrompt('drone shot, aerial view, sweeping camera')">🚁 Drone</div>
<div class="chip" onclick="setPrompt('pakistani culture, traditional, vibrant')">🇵🇰 Pakistani</div>
</div>

<label>Duration</label>
<select id="durSel">
<option value="4">4 seconds</option>
<option value="5" selected>5 seconds</option>
<option value="6">6 seconds</option>
<option value="8">8 seconds</option>
<option value="10">10 seconds</option>
<option value="12">12 seconds</option>
</select>

<button class="btn" id="genBtn" onclick="gen()">🎬 Generate Video</button>

<div class="status" id="statusBox">
<div class="spin"></div>
<div class="m" id="statusMsg">Generating video...</div>
<div class="s">2-5 minute lag sakte hain</div>
</div>

<div class="err" id="errBox"></div>

<div class="result" id="resultBox">
<video id="resultVid" controls loop playsinline></video>
<button class="dl" onclick="download()">⬇ Download Video</button>
</div>
</div>

<div class="foot">© 2026 Adnan AI Video</div>
</div>

<script>
var currentUrl = '';
function setPrompt(s){
    var el = document.getElementById('promptIn');
    var cur = el.value.trim();
    el.value = cur ? cur + ', ' + s : s;
}
function showErr(m){
    var e = document.getElementById('errBox');
    e.textContent = m; e.classList.add('on');
    setTimeout(function(){e.classList.remove('on')}, 12000);
}
function gen(){
    var p = document.getElementById('promptIn').value.trim();
    var d = document.getElementById('durSel').value;
    if(!p){ showErr('Prompt likho'); return; }
    var btn = document.getElementById('genBtn');
    btn.disabled = true; btn.textContent = '⏳ Starting...';
    document.getElementById('statusBox').classList.add('on');
    document.getElementById('resultBox').classList.remove('on');
    var fd = new FormData();
    fd.append('prompt', p); fd.append('duration', d);
    fetch('/generate', {method:'POST', body:fd})
    .then(function(r){return r.json()})
    .then(function(res){
        if(res.error){ showErr(res.error); btn.disabled=false; btn.textContent='🎬 Generate Video'; document.getElementById('statusBox').classList.remove('on'); return; }
        poll(res.job_id);
    })
    .catch(function(){ showErr('Network error'); btn.disabled=false; btn.textContent='🎬 Generate Video'; document.getElementById('statusBox').classList.remove('on'); });
}
function poll(id){
    var btn = document.getElementById('genBtn');
    var msgs = ['Generating frames...', 'Rendering...', 'Adding motion...', 'Finalizing...', 'Almost done...'];
    var i = 0;
    function check(){
        fetch('/status/' + id)
        .then(function(r){return r.json()})
        .then(function(d){
            if(d.status === 'done'){
                document.getElementById('statusBox').classList.remove('on');
                document.getElementById('resultVid').src = d.url;
                document.getElementById('resultBox').classList.add('on');
                currentUrl = d.url;
                btn.disabled = false; btn.textContent = '🎬 Generate Another';
                document.getElementById('resultBox').scrollIntoView({behavior:'smooth'});
            } else if(d.status === 'failed' || d.status === 'error'){
                document.getElementById('statusBox').classList.remove('on');
                showErr(d.error || 'Video generate nahi hui');
                btn.disabled = false; btn.textContent = '🎬 Generate Video';
            } else {
                document.getElementById('statusMsg').textContent = msgs[i % msgs.length];
                i++;
                setTimeout(check, 8000);
            }
        })
        .catch(function(){ setTimeout(check, 8000); });
    }
    check();
}
function download(){
    if(!currentUrl) return;
    var a = document.createElement('a');
    a.href = currentUrl;
    a.download = 'adnan-ai-' + Date.now() + '.mp4';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>
</body></html>
